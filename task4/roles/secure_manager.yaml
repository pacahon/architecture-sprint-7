apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secure_manager
rules:
- apiGroups: [""]
  resources: ["networkpolicies", "events", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets", "networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]